name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Pin the upstream revision so every build is reproducible.
  # The patches were generated against and verified on this tag.
  SM_REF: RELEASE_7_5
  UPSTREAM: https://github.com/smartmontools/smartmontools.git
  # Upstream keeps the sources one level down: <repo>/smartmontools/.
  SRC: src/smartmontools
  # autogen.sh probes for versioned names like automake-1.16, which modern
  # distros no longer ship. It honours these overrides instead.
  AUTOMAKE: automake
  ACLOCAL: aclocal

jobs:
  win64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool gettext pkg-config \
            mingw-w64 g++-mingw-w64-x86-64 \
            nsis zip unzip

      - name: Fetch upstream sources
        run: |
          git clone --depth 1 --branch "$SM_REF" "$UPSTREAM" src
          git -C src rev-parse HEAD | tee src_rev.txt
          test -f "$SRC/configure.ac" || { echo "::error::$SRC/configure.ac missing"; ls -la src; exit 1; }
          echo "Building upstream revision: $(cat src_rev.txt)"

      - name: Apply patches
        run: |
          shopt -s nullglob
          patches=(patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patches in patches/ — building pristine upstream."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "::group::apply $p"
            git -C "$SRC" apply -v "$(realpath "$p")"
            echo "::endgroup::"
          done

      - name: Bootstrap
        working-directory: src/smartmontools
        run: ./autogen.sh

      - name: Configure (mingw-w64 cross)
        working-directory: src/smartmontools
        run: ./configure --build=x86_64-pc-linux-gnu --host=x86_64-w64-mingw32

      - name: Build
        working-directory: src/smartmontools
        run: make -j"$(nproc)"

      # Best effort: upstream's own NSIS packaging. Needs a second build tree
      # for the 32-bit half, which this workflow does not produce, so it is
      # allowed to fail without killing the run.
      - name: Try upstream NSIS installer (non-blocking)
        working-directory: src/smartmontools
        continue-on-error: true
        run: |
          make dist-win32 || true
          make installer-win32 || true
          ls -l *.zip *.exe 2>/dev/null || true

      - name: Package
        run: |
          set -e
          mkdir -p out
          count=0
          while IFS= read -r f; do
            parent=$(basename "$(dirname "$f")")
            case "$parent" in
              bin32) dest=out/bin32 ;;
              *)     dest=out/bin ;;
            esac
            mkdir -p "$dest"
            cp "$f" "$dest/"
            count=$((count + 1))
          done < <(find "$SRC" -maxdepth 3 -type f -name '*.exe')

          echo "collected $count exe file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No .exe produced — cross build failed. Check configure parameters."
            find "$SRC" -maxdepth 2 -type d | head -30
            exit 1
          fi

          for extra in drivedb.h smartd.conf COPYING NEWS; do
            [ -f "$SRC/$extra" ] && cp "$SRC/$extra" out/ || true
          done
          cp NOTICE out/ 2>/dev/null || true
          cp "$SRC/COPYING" out/ 2>/dev/null || true
          cp src_rev.txt out/UPSTREAM_REVISION.txt 2>/dev/null || true

          for f in "$SRC"/*win32-setup.exe "$SRC"/*.win32.zip; do
            [ -f "$f" ] && cp "$f" out/ || true
          done

          name="smartmontools-develop-win64-${GITHUB_SHA::7}"
          (cd out && zip -9 -r "../${name}.zip" .)
          unzip -l "${name}.zip"
          ls -l "${name}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartmontools-develop-win64
          path: smartmontools-develop-win64-*.zip
          if-no-files-found: error
